version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: workflow-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: workflow-service
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy 
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: workflow_db
      DB_SSLMODE: disable

volumes:
  postgres_data: